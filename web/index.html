<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aero IM — Debug Client</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- toast container -->
  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

  <!-- AUTH VIEW -->
  <section id="view-auth" class="view view-auth" hidden>
    <div class="auth-card">
      <header class="auth-header">
        <div class="brand-mark">A</div>
        <h1>Aero IM</h1>
        <p class="muted">debug client · 联调专用</p>
      </header>

      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="login" role="tab">登录</button>
        <button class="tab" data-tab="register" role="tab">注册</button>
      </nav>

      <form id="form-login" class="auth-form" data-tab-panel="login">
        <label>
          <span>邮箱</span>
          <input type="email" name="email" autocomplete="email" required />
        </label>
        <label>
          <span>密码</span>
          <input type="password" name="password" autocomplete="current-password" required minlength="6" />
        </label>
        <button type="submit" class="btn-primary">登录</button>
      </form>

      <form id="form-register" class="auth-form" data-tab-panel="register" hidden>
        <label>
          <span>邮箱</span>
          <input type="email" name="email" autocomplete="email" required />
        </label>
        <label>
          <span>显示名</span>
          <input type="text" name="display_name" autocomplete="nickname" required minlength="1" maxlength="64" />
        </label>
        <label>
          <span>密码</span>
          <input type="password" name="password" autocomplete="new-password" required minlength="6" />
        </label>
        <button type="submit" class="btn-primary">注册并登录</button>
      </form>
    </div>
  </section>

  <!-- CHAT VIEW -->
  <section id="view-chat" class="view view-chat" hidden>
    <aside class="pane pane-left">
      <header class="pane-head">
        <div class="brand-row">
          <div class="brand-mark sm">A</div>
          <span class="brand-name">Aero IM</span>
          <span id="ws-dot" class="ws-dot ws-down" title="WebSocket"></span>
        </div>
        <button id="btn-new-room" class="btn-ghost" title="新建房间">+ 新建</button>
      </header>

      <div id="room-list" class="room-list"></div>

      <footer class="pane-foot">
        <div class="me-row">
          <div id="me-avatar" class="avatar">·</div>
          <div class="me-info">
            <div id="me-name" class="me-name">—</div>
            <div id="me-email" class="me-email muted"></div>
          </div>
        </div>
        <button id="btn-logout" class="btn-link">退出</button>
      </footer>
    </aside>

    <main class="pane pane-center">
      <header id="room-head" class="room-head">
        <div class="room-head-title">
          <h2 id="room-name">选择房间</h2>
          <span id="room-meta" class="muted"></span>
        </div>
        <div class="room-head-actions">
          <div class="head-tools">
            <button id="btn-search" type="button" title="搜索">🔍 搜索</button>
            <button id="btn-ai" type="button" title="问 AI">✨ AI</button>
            <button id="btn-call-audio" type="button" title="发起语音通话">📞</button>
            <button id="btn-call-video" type="button" title="发起视频通话">📹</button>
            <button id="btn-go-live" type="button" title="开播">🔴 开播</button>
            <button id="btn-live-page" type="button" title="直播大厅">📺</button>
          </div>
          <button id="btn-add-member" class="btn-ghost" hidden>+ 添加成员</button>
        </div>
      </header>

      <div id="msg-scroll" class="msg-scroll">
        <div id="msg-list" class="msg-list"></div>
        <div id="msg-empty" class="msg-empty muted" hidden>暂无消息,开个头吧。</div>
      </div>

      <div id="typing-bar" class="typing-bar" hidden></div>

      <form id="composer" class="composer" hidden>
        <div class="composer-aux">
          <button type="button" id="btn-attach" title="附件">📎</button>
          <button type="button" id="btn-voice" title="按住录音 / 点击开始">🎙</button>
        </div>
        <textarea
          id="composer-input"
          placeholder="输入消息,回车发送,Shift+回车换行"
          rows="1"
          maxlength="8000"></textarea>
        <button type="submit" id="composer-send" class="btn-primary" disabled>发送</button>
        <input id="file-input" type="file" hidden />
      </form>
    </main>

    <aside class="pane pane-right">
      <header class="pane-head">
        <span class="pane-title">在线成员</span>
        <span id="online-count" class="badge">0</span>
      </header>
      <div id="online-list" class="online-list"></div>
    </aside>
  </section>

  <!-- modal: new room -->
  <div id="modal-new-room" class="modal" hidden>
    <div class="modal-card">
      <header class="modal-head">
        <h3>新建房间</h3>
        <button class="btn-icon" data-close>×</button>
      </header>
      <form id="form-new-room" class="modal-body">
        <label>
          <span>类型</span>
          <select name="kind">
            <option value="group">群组 group</option>
            <option value="channel">频道 channel</option>
            <option value="direct">直接消息 direct</option>
          </select>
        </label>
        <label>
          <span>名称(group/channel 可填)</span>
          <input type="text" name="name" maxlength="64" placeholder="例如:研发联调" />
        </label>
        <footer class="modal-foot">
          <button type="button" class="btn-ghost" data-close>取消</button>
          <button type="submit" class="btn-primary">创建</button>
        </footer>
      </form>
    </div>
  </div>

  <!-- drawer: search -->
  <aside id="drawer-search" class="drawer" hidden>
    <header class="drawer-head">
      <h3>搜索房间消息</h3>
      <button class="btn-icon" data-close-drawer="search">×</button>
    </header>
    <div class="drawer-foot">
      <input id="search-input" class="drawer-input" placeholder="关键词 / 自然语言查询…" />
    </div>
    <div id="search-results" class="drawer-body">
      <div class="muted" style="text-align:center;padding:24px 0;font-size:12.5px;">输入关键词回车开搜。</div>
    </div>
  </aside>

  <!-- drawer: AI -->
  <aside id="drawer-ai" class="drawer" hidden>
    <header class="drawer-head">
      <h3>问 AI (RAG)</h3>
      <div style="display:flex;gap:6px;">
        <button id="btn-ai-summarize" class="btn-ghost">摘要</button>
        <button class="btn-icon" data-close-drawer="ai">×</button>
      </div>
    </header>
    <div id="ai-results" class="drawer-body"></div>
    <div class="drawer-foot">
      <input id="ai-input" class="drawer-input" placeholder="基于本房间历史向 AI 提问…" />
    </div>
  </aside>

  <!-- drawer: live streams -->
  <aside id="drawer-live" class="drawer" hidden>
    <header class="drawer-head">
      <h3>直播大厅</h3>
      <button class="btn-icon" data-close-drawer="live">×</button>
    </header>
    <div id="live-list" class="drawer-body live-list"></div>
  </aside>

  <!-- modal: go live -->
  <div id="modal-go-live" class="modal" hidden>
    <div class="modal-card">
      <header class="modal-head">
        <h3>开播</h3>
        <button class="btn-icon" data-close>×</button>
      </header>
      <form id="form-go-live" class="modal-body">
        <label>
          <span>标题</span>
          <input type="text" name="title" required maxlength="120" placeholder="例如:周会直播" />
        </label>
        <label>
          <span>协议</span>
          <select name="protocol">
            <option value="rtmp">RTMP(ffmpeg/OBS)</option>
            <option value="whip">WHIP(浏览器直推)</option>
            <option value="srt">SRT</option>
          </select>
        </label>
        <footer class="modal-foot">
          <button type="button" class="btn-ghost" data-close>取消</button>
          <button type="submit" class="btn-primary">创建</button>
        </footer>
      </form>
    </div>
  </div>

  <!-- modal: stream ingest info -->
  <div id="modal-stream-info" class="modal" hidden>
    <div class="modal-card">
      <header class="modal-head">
        <h3>推流信息</h3>
        <button class="btn-icon" data-close>×</button>
      </header>
      <div class="modal-body">
        <label>
          <span>推流地址(复制到 OBS / ffmpeg)</span>
          <input id="stream-ingest" type="text" readonly />
        </label>
        <label>
          <span>HLS 拉流地址</span>
          <input id="stream-hls" type="text" readonly />
        </label>
        <div class="muted" style="font-size:12px;">
          示例:<code>ffmpeg -re -i video.mp4 -c copy -f flv &lt;ingest&gt;</code>
        </div>
      </div>
    </div>
  </div>

  <!-- call overlay -->
  <div id="call-overlay" class="call-overlay" hidden>
    <div class="call-videos">
      <div class="call-tile"><video id="call-local" autoplay muted playsinline></video><span class="label">我</span></div>
      <div class="call-tile"><video id="call-remote" autoplay playsinline></video><span class="label">对方</span></div>
    </div>
    <div class="call-controls">
      <button id="call-mute">静音</button>
      <button id="call-cam">关摄像头</button>
      <button id="call-end" class="end">挂断</button>
    </div>
  </div>

  <!-- modal: add member -->
  <div id="modal-add-member" class="modal" hidden>
    <div class="modal-card">
      <header class="modal-head">
        <h3>添加成员</h3>
        <button class="btn-icon" data-close>×</button>
      </header>
      <form id="form-add-member" class="modal-body">
        <label>
          <span>Participant ID</span>
          <input type="text" name="participant_id" required placeholder="01J..." />
        </label>
        <footer class="modal-foot">
          <button type="button" class="btn-ghost" data-close>取消</button>
          <button type="submit" class="btn-primary">添加</button>
        </footer>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
