# Compose-ready Prometheus configuration for Aero IM. The metrics token is a
# Docker secret shared with the gateway; never put its value in this file.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/recording_rules.yml
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: aero-im
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/aero_metrics_token
    static_configs:
      - targets: ["app:8080"]
