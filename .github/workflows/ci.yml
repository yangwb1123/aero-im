# Aero IM CI — uses aero-cli for unified gate running
name: Aero IM CI
on:
  push: { branches: [main, 'release/*'] }
  pull_request: { branches: [main] }
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --workspace

  check:
    name: cargo check + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo check --workspace --all-targets -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --workspace --lib

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: aero
          POSTGRES_USER: aero
          POSTGRES_DB: aero
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build -p aero-server --bin aero-cli
      # Create minimal config for aero-cli migrate
      - run: |
          cat > config.toml << 'EOF'
          [server]
          host = "0.0.0.0"
          port = 8080
          web_dir = "./web"
          [database]
          url = "postgres://aero:aero@localhost:5432/aero"
          max_connections = 4
          [redis]
          url = "redis://localhost:6379"
          [nats]
          url = "nats://localhost:4222"
          [auth]
          jwt_private_key_pem = ""
          jwt_public_key_pem = ""
          issuer = "aero-ci"
          access_ttl_secs = 3600
          refresh_ttl_secs = 604800
          EOF
        env:
          DATABASE_URL: postgres://aero:aero@localhost:5432/aero
      - run: cargo run --bin aero-cli -- migrate
        env:
          DATABASE_URL: postgres://aero:aero@localhost:5432/aero
      # Migration chain smoke test on throwaway database
      - name: Migration chain smoke test
        run: |
          psql -h localhost -U aero -d postgres -c "CREATE DATABASE aero_migrate_smoke OWNER aero;"
          DATABASE_URL="postgres://aero:aero@localhost:5432/aero_migrate_smoke" cargo run --bin aero-cli -- migrate
        env:
          PGPASSWORD: aero
      - run: cargo test --workspace -- --include-ignored
        env:
          DATABASE_URL: postgres://aero:aero@localhost:5432/aero
      - run: |
          psql -h localhost -U aero -d postgres -c "DROP DATABASE IF EXISTS aero_migrate_smoke;"
        env:
          PGPASSWORD: aero

  gates:
    name: Engineering gates via aero-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cargo build -p aero-server --bin aero-cli
      - run: ./target/debug/aero-cli gate all

  security:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo install cargo-deny
      - run: cargo deny check
