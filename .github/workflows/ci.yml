# Aero IM — CI/CD 管线配置模板
# 注意：当前无 CI runner，此配置作为"就位准备"。
# 当 CI runner 接入后，取消注释对应区块即可启用。

name: Aero IM CI

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ## --- Layer 3: Harness Engineering ---
  check:
    name: Harness — cargo check + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Harness — cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --workspace --lib

  size-check:
    name: Harness — file size check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/file-size-check.sh

  truth-check:
    name: Harness — truth check（写了但没接线 死代码检测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/truth-check.sh

  web-check:
    name: Harness — web check（前端 JS 语法 + import 解析，零工具链）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: bash scripts/web-check.sh

  dependency-check:
    name: Harness — dependency direction audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/dependency-check.sh

  ## --- Layer 4: Evaluation Engineering ---
  security-audit:
    name: Eval — cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo install cargo-deny
      - run: cargo deny check

