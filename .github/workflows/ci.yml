# Aero IM CI — uses aero-cli for unified gate running
name: Aero IM CI
on:
  push: { branches: [main, 'release/*'] }
  pull_request: { branches: [main] }
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --workspace --locked

  msrv:
    name: MSRV 1.80
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.80.0
      - run: cargo check --workspace --all-targets --locked

  check:
    name: cargo check + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # The workspace intentionally carries a documented clippy backlog; the
      # repository gates prohibit new warnings rather than pretending the
      # existing backlog can be promoted to hard errors.
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --workspace --lib --locked
      # This integration target is source-driven and needs no database. Keeping
      # it explicit prevents `--lib` from silently dropping the authorization
      # lint from CI.
      - run: cargo test -p aero-server --test authz_lint --locked
      # B5-1 dual-moderation pin (design gate F1): the claim_validation
      # integration tests (tests/ target) and the drill's unit pins (bin
      # target) are hermetic — `--lib` never runs them, so they must be
      # explicit or the moderation-token pin never executes in CI.
      - run: cargo test -p aero-audit-connector --tests --bins --locked

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: aero
          POSTGRES_USER: aero
          POSTGRES_DB: aero
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build -p aero-server --bin aero-cli --locked
      - name: Start NATS JetStream
        run: |
          docker run --detach --name aero-nats --publish 4222:4222 nats:2.10-alpine -js
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/4222) 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs aero-nats
          exit 1
      # Create minimal config for aero-cli migrate
      - run: |
          cat > config.toml << 'EOF'
          [server]
          host = "0.0.0.0"
          port = 8080
          web_dir = "./web"
          [database]
          url = "postgres://aero:aero@localhost:5432/aero"
          max_connections = 4
          [redis]
          url = "redis://localhost:6379"
          [nats]
          url = "nats://localhost:4222"
          [auth]
          jwt_private_key_pem = ""
          jwt_public_key_pem = ""
          issuer = "aero-ci"
          access_ttl_secs = 3600
          refresh_ttl_secs = 604800
          EOF
        env:
          DATABASE_URL: postgres://aero:aero@localhost:5432/aero
      - run: cargo run --locked --bin aero-cli -- migrate
        env:
          AERO__DATABASE__URL: postgres://aero:aero@localhost:5432/aero
      # Migration chain smoke test on throwaway database
      - name: Migration chain smoke test
        run: |
          psql -h localhost -U aero -d postgres -c "CREATE DATABASE aero_migrate_smoke OWNER aero;"
          AERO__DATABASE__URL="postgres://aero:aero@localhost:5432/aero_migrate_smoke" cargo run --locked --bin aero-cli -- migrate
          expected="$(find migrations -maxdepth 1 -type f -name '*.sql' | wc -l)"
          applied="$(psql -h localhost -U aero -d aero_migrate_smoke -Atc \
            'SELECT count(*) FROM _sqlx_migrations WHERE success')"
          test "$applied" -eq "$expected"
        env:
          PGPASSWORD: aero
      - name: Rolling-upgrade migration regression
        run: |
          psql -h localhost -U aero -d postgres -c "CREATE DATABASE aero_rollout_smoke OWNER aero;"
          DATABASE_URL="postgres://aero:aero@localhost:5432/aero_rollout_smoke" \
            cargo test -p aero-storage --lib --locked \
              rolling_upgrade_fences_are_atomic_before_0176_reasserts_them \
              -- --ignored --test-threads=1
          psql -h localhost -U aero -d postgres -c "DROP DATABASE aero_rollout_smoke WITH (FORCE);"
        env:
          PGPASSWORD: aero
      # Notification fan-out suite (AT-1…AT-7): fresh throwaway DB of its own
      # (aero_test_notif_<pid>), build-before-migrate, both URL pairs, and a
      # REQUIRED Redis presence leg (redis service above). Also fails closed on
      # AERO_BLOCKED_WORDS / AERO_PII_GUARD* / AERO_AI_* env leakage.
      - name: Notification fan-out DB-gated suite
        run: bash scripts/test-notification-fanout.sh
        env:
          DATABASE_URL: postgres://aero:aero@localhost:5432
          REDIS_URL: redis://localhost:6379
          AERO__REDIS__URL: redis://localhost:6379
      - run: |
          cargo test --workspace --lib --locked -- \
            --ignored --test-threads=1 \
            --skip eicar_is_reported_infected_against_real_clamd \
            --skip rolling_upgrade_fences_are_atomic_before_0176_reasserts_them \
            --skip db_tests::
        env:
          DATABASE_URL: postgres://aero:aero@localhost:5432/aero
          REDIS_URL: redis://localhost:6379
          AERO__REDIS__URL: redis://localhost:6379
          AERO__NATS__URL: nats://localhost:4222
      - run: |
          psql -h localhost -U aero -d postgres -c "DROP DATABASE IF EXISTS aero_migrate_smoke;"
        env:
          PGPASSWORD: aero

  gates:
    name: Engineering gates via aero-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
        working-directory: web
      - run: cargo build -p aero-server --bin aero-cli --locked
      - run: ./target/debug/aero-cli gate all
      - run: npm test
        working-directory: web
      - run: npm run lint
        working-directory: web

  security:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
