architecture_summary: |
  Recall replaces message content with a system placeholder (row/history/
  audit intact), records recalled_at/recalled_by, and broadcasts a
  Recalled room event via the transactional event outbox. Permission: the
  author or a room owner/admin (pure table-driven decision + row-locked
  storage re-check `recalled_at IS NULL`). Stable failure ordering
  (404/403/409) with no cross-tenant existence oracle. changes_since
  replay keys on GREATEST(edited_at, deleted_at, recalled_at); client
  held-id replay rows route through the mutation funnel; SPA has REST +
  WS recall entry points with 409→success mapping.

