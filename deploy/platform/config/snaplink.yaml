version: 1

server:
  issuer: http://localhost:28080
  base_url: http://localhost:28080
  listen: ":8080"
  session_ttl: 24h
  token_ttl: 1h
  default_token_strategy: jwt
  require_form_content_type: true

logging:
  level: info

identity:
  backend: sqlite
  sqlite:
    dsn: file:/var/lib/snaplink/identity.db?_journal=WAL&_pragma=busy_timeout(5000)

self_service:
  password:
    backend: sqlite
    sqlite:
      dsn: file:/var/lib/snaplink/passwords.db?_journal=WAL&_pragma=busy_timeout(5000)

audit:
  enabled: true
  api_enabled: true
  backend: sqlite
  sqlite:
    dsn: file:/var/lib/snaplink/audit.db?_journal=WAL&_pragma=busy_timeout(5000)
  hash_chain: true

permissions:
  enabled: true
  backend: sqlite
  sqlite:
    dsn: file:/var/lib/snaplink/permissions.db?_journal=WAL&_pragma=busy_timeout(5000)
  embed_in_login: true
  apps:
    - client_id: sso-admin-console
      roles:
        - code: sso-admin
          name: Snaplink Administrator
          permissions: [admin:*]
    - client_id: aero-id
      roles:
        - code: aero-platform-admin
          name: Aero Platform Administrator
          permissions:
            - account.read
            - account.manage
            - operation.read
            - operation.manage
            - source.sync
            - account.export
            - account.erase
            - audit.read
  user_roles:
    - { user_id: admin, client_id: sso-admin-console, roles: [sso-admin] }
    - { user_id: admin, client_id: aero-id, roles: [aero-platform-admin] }

admin:
  enabled: true
  api_rest_enabled: true

keys:
  signing:
    alg: eddsa
    key_file: /var/lib/snaplink/signing-key.pem
  rotation:
    enabled: false

authenticators:
  password:
    enabled: true
    users:
      - username: admin
        bcrypt_hash_file: /var/lib/snaplink/admin.bcrypt
        subject_id: admin

security:
  cors:
    enabled: true
    allowed_origins:
      - http://localhost:28000
      - http://localhost:28010
      - http://localhost:28082
    allowed_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowed_headers: [Authorization, Content-Type, X-Request-ID]
    exposed_headers: [X-Request-ID, Retry-After]
    allow_credentials: true
    max_age: 1h

oauth:
  backend: sqlite
  sqlite:
    dsn: file:/var/lib/snaplink/oauth.db?_journal=WAL&_pragma=busy_timeout(5000)
  auth_code:
    enabled: true
    ttl: 10m
  refresh_token:
    enabled: true
    ttl: 720h
  scope_registry:
    enabled: true
    extra_scopes:
      - account:summary:read
      - aero.account.summary.read
      - aero.notify.publish
      - read
      - write
      - audit:platform:cross_tenant
      - audit:policy:read
      - audit:policy:write
      - account:read
      - account:write
      - operation:read
      - source:sync
      - audit:read

tenant:
  enabled: true

clients:
  - id: sso-admin-console
    secret: local-console-secret-change-before-production
    name: Snaplink Admin Console
    redirect_uris: []
    allowed_scopes: [openid, profile, admin:read, admin:write]
    allowed_authenticators: [password]
    allowed_resources: [audit-governance]
    token_strategy: jwt
    tenant_id: platform-local
    active: true

  - id: aero-account-console
    secret: ""
    name: Aero Account Console
    token_endpoint_auth_method: none
    redirect_uris: [http://localhost:28010/]
    post_logout_redirect_uris: [http://localhost:28010/]
    allowed_scopes: [openid, profile, account:read, account:write, operation:read, source:sync, audit:read]
    allowed_authenticators: [password]
    allowed_resources: [aero-id]
    token_strategy: jwt
    tenant_id: platform-local
    require_pkce: true
    allowed_pkce_methods: [S256]
    skip_consent: true
    active: true

  - id: aero-im
    secret: local-aero-im-browser-secret-change-before-production
    name: Aero IM
    redirect_uris:
      - https://localhost:28482/callback
    allowed_scopes: [openid, profile, email]
    allowed_authenticators: [password]
    allowed_resources: [aero-im]
    token_strategy: jwt
    tenant_id: platform-local
    active: true

  - id: aero-id-snaplink-source
    secret: local-aero-id-snaplink-source-secret-0001
    name: Aero ID Snaplink source
    redirect_uris: []
    allowed_scopes: [account:summary:read]
    allowed_authenticators: []
    allowed_resources: [snaplink-account-source]
    token_strategy: jwt
    tenant_id: platform-local
    active: true

  - id: aero-id-im-source
    secret: local-aero-id-im-source-secret-00000001
    name: Aero ID IM source
    redirect_uris: []
    allowed_scopes: [aero.account.summary.read]
    allowed_authenticators: []
    allowed_resources: [aero-im-integration]
    token_strategy: jwt
    tenant_id: platform-local
    active: true

  - id: aero-id-vault-source
    secret: local-aero-id-vault-source-secret-00001
    name: Aero ID Vault source
    redirect_uris: []
    allowed_scopes: [read]
    allowed_authenticators: []
    allowed_resources: [aero-vault]
    token_strategy: jwt
    tenant_id: platform-local
    active: true

  - id: aero-im-vault
    secret: local-aero-im-vault-secret-000000000001
    name: Aero IM Vault client
    redirect_uris: []
    allowed_scopes: [read, write]
    allowed_authenticators: []
    allowed_resources: [aero-vault]
    token_strategy: jwt
    tenant_id: platform-local
    active: true

  - id: aero-id-audit
    secret: local-aero-id-audit-secret-000000000001
    name: Aero ID audit relay
    redirect_uris: []
    allowed_scopes: [audit:event:write]
    allowed_authenticators: []
    allowed_resources: [audit-governance]
    token_strategy: jwt
    tenant_id: platform-local
    active: true

  - id: aero-vault-audit
    secret: local-aero-vault-audit-secret-000000001
    name: Aero Vault audit relay
    redirect_uris: []
    allowed_scopes: [audit:event:write]
    allowed_authenticators: []
    allowed_resources: [audit-governance]
    token_strategy: jwt
    tenant_id: platform-local
    active: true

  - id: aero-im-audit
    secret: local-aero-im-audit-secret-000000000001
    name: Aero IM audit relay
    redirect_uris: []
    allowed_scopes: [audit:event:write]
    allowed_authenticators: []
    allowed_resources: [audit-governance]
    token_strategy: jwt
    tenant_id: platform-local
    active: true

  - id: platform-audit-bootstrap
    secret: local-platform-audit-bootstrap-secret-0001
    name: Platform audit provisioner
    redirect_uris: []
    allowed_scopes: [audit:platform:cross_tenant, audit:policy:read, audit:policy:write]
    allowed_authenticators: []
    allowed_resources: [audit-governance]
    token_strategy: jwt
    active: true
