app: { name: aero-id, env: local-platform, version: 0.1.0 }
account:
  issuer: http://localhost:28080
  region: local
  home_region_version: v1
  regions: [local]

sources:
  snaplink:
    endpoint: http://127.0.0.1:18080
    summary_path: /internal/account-summary
    region: local
    oauth_token_url: http://127.0.0.1:18080/token
    oauth_client_id: aero-id-snaplink-source
    oauth_client_secret: local-aero-id-snaplink-source-secret-0001
    oauth_scope: account:summary:read
    oauth_resource: snaplink-account-source
    timeout: 3s
    max_body_bytes: 1048576
    max_concurrency: 16
    max_attempts: 3
    retry_backoff: 50ms
  aero_im:
    endpoint: http://127.0.0.1:18082
    summary_path: /internal/account-summary
    region: local
    oauth_token_url: http://127.0.0.1:18080/token
    oauth_client_id: aero-id-im-source
    oauth_client_secret: local-aero-id-im-source-secret-00000001
    oauth_scope: aero.account.summary.read
    oauth_resource: aero-im
    timeout: 3s
    max_body_bytes: 1048576
    max_concurrency: 16
    max_attempts: 3
    retry_backoff: 50ms
  aero_vault:
    endpoint: http://127.0.0.1:18081
    summary_path: /v1/internal/account-summary
    region: local
    oauth_token_url: http://127.0.0.1:18080/token
    oauth_client_id: aero-id-vault-source
    oauth_client_secret: local-aero-id-vault-source-secret-00001
    oauth_scope: read
    oauth_resource: aero-vault
    timeout: 3s
    max_body_bytes: 1048576
    max_concurrency: 16
    max_attempts: 3
    retry_backoff: 50ms

server:
  http:
    host: 0.0.0.0
    port: 8080
    cors_origins: [http://localhost:28010]
    read_timeout: 15s
    read_header_timeout: 10s
    write_timeout: 15s
    shutdown_timeout: 10s
    request_timeout: 30s
  grpc:
    host: 0.0.0.0
    port: 9090
    keepalive_min_ping_interval: 10s
    max_concurrent_streams: 100
    max_recv_msg_size: 4194304
    max_send_msg_size: 4194304

redis:
  endpoint: aero-id-redis:6379

database:
  host: aero-id-postgres
  port: 5432
  user: aero
  password: local-aero-id-db-password
  dbname: aero_id
  sslmode: disable
  max_open_conns: 30
  max_idle_conns: 10
  conn_max_lifetime: 1h
  log_level: warn
  auto_migrate: false
  migrations_dir: /app/migrations

sso:
  endpoint: snaplink:8081
  jwks_url: http://127.0.0.1:18080/.well-known/jwks.json
  issuer: http://localhost:28080
  audience: aero-id
  authz_client_id: aero-id
  authz_required: false
  authz_legacy_fallback: true
  insecure: true
  readiness_critical: true
  timeout: 5s
  jwks_cache_ttl: 5m
  jwks_max_body_bytes: 1048576
  max_attempts: 3
  retry_backoff: 50ms
  max_concurrent: 64
  user_batch_size: 128

audit_ledger:
  signing_key: local-aero-id-ledger-signing-key-00000001

audit_governance:
  enabled: true
  endpoint: http://127.0.0.1:18089
  source_prefix: aero-id
  actor_id: aero-id
  schema_id: aero.id.audit-fact
  schema_version: 1
  anchor_scheme: uuidv5-nul-separated
  anchor_scheme_version: 1
  data_classification: personal
  retention_class: account_7y
  timeout: 5s
  refresh_skew: 30s
  allow_insecure_loopback: true
  purge_pause: false
  dead_letter_retention: 0
  bindings:
    platform-local:
      token_url: http://127.0.0.1:18080/token
      client_id: aero-id-audit
      client_secret_env: AERO_ID_AUDIT_CLIENT_SECRET_PLATFORM_LOCAL
      scope: audit:event:write
      resources: [audit-governance]

billing:
  enabled: false

callback:
  master_key: ""
  request_timeout: 5s
  max_response_bytes: 65536
  max_attempts: 8
  retry_base: 1s
  worker_interval: 1s
  worker_concurrency: 4

storage:
  type: local
  max_upload_bytes: 52428800
  local:
    root: /var/lib/aero-id/files
    public_base_url: http://localhost:28083

signing_key: local-aero-id-signing-key-000000000001
log: { level: info, encoding: console, sample_ratio: 0 }
