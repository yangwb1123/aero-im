server {
    listen 127.0.0.1:18080;
    # Aero ID's generic source connector probes /healthz. Snaplink exposes
    # readiness as /readyz, so keep the translation at this loopback edge.
    location = /healthz {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $snaplink snaplink:8080;
        proxy_pass http://$snaplink/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
    location / {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $snaplink snaplink:8080;
        proxy_pass http://$snaplink;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
}

server {
    listen 127.0.0.1:18081;
    location = /token {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $snaplink snaplink:8080;
        proxy_pass http://$snaplink/token;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
    location / {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $vault aero-vault-edge:8080;
        proxy_pass http://$vault;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
}

server {
    listen 127.0.0.1:18082;
    location = /token {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $snaplink snaplink:8080;
        proxy_pass http://$snaplink/token;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
    # Aero IM uses layered health endpoints rather than /healthz. Source
    # aggregation depends on its readiness probe, including DB/Redis/NATS/blob.
    location = /healthz {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $im aero-im-edge:8080;
        proxy_pass http://$im/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
    location / {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $im aero-im-edge:8080;
        proxy_pass http://$im;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
}

server {
    listen 127.0.0.1:18089;
    location / {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $audit audit-governance-edge:8089;
        proxy_pass http://$audit;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
}
