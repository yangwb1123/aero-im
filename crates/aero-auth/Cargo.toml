[package]
name = "aero-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aero-common.workspace = true
aero-storage.workspace = true

tokio.workspace = true
axum.workspace = true
async-trait.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
time.workspace = true

jsonwebtoken.workspace = true
uuid.workspace = true
argon2.workspace = true
password-hash.workspace = true
rand.workspace = true
rsa.workspace = true

# TOTP (RFC 6238) 2FA: HMAC-SHA1 over the time-step counter. Both are small,
# pure RustCrypto crates already present in the lockfile (transitive deps); base32
# is hand-rolled in `totp` so no extra dependency is needed for it.
hmac = "0.12"
sha1 = "0.10"

# OIDC JWKS fetch (SSO): live retrieval of the IdP's signing keys. This is the
# one network seam in `oidc`; the validation logic itself is unit-tested offline.
reqwest.workspace = true

# sqlx is reachable only through the storage layer's error type; we name it to
# inspect `is_unique_violation()` for friendly Conflict mapping.
sqlx.workspace = true

# Redis (fred) backs the optional cross-node login-lockout aggregation
# (`login_throttle::RedisFailureStore`); in-process stays the default.
fred.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
