[package]
name = "aero-live-whip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aero-common.workspace = true
aero-live-core.workspace = true
aero-live-hls.workspace = true
aero-signaling.workspace = true
aero-storage.workspace = true

tokio = { workspace = true, features = ["sync", "rt", "net", "time", "macros"] }
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
ulid = { workspace = true, features = ["serde", "uuid"] }
uuid.workspace = true
time.workspace = true
parking_lot.workspace = true

# WebRTC media plane (P5). sans-IO; pure-Rust crypto backend (`rust-crypto`)
# avoids native build deps (openssl / aws-lc-rs+nasm) so the crate always
# compiles in CI without a C toolchain.
str0m = { version = "0.19", default-features = false, features = ["rust-crypto"] }

# WHEP upstream relay client: HTTP SDP exchange with a peer node.
reqwest = { workspace = true }
