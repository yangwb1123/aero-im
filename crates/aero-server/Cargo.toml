[package]
name = "aero-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "aero-server"
path = "src/bin/main.rs"

[[bin]]
name = "aero-cli"
path = "src/bin/aero-cli.rs"

[dependencies]
aero-common.workspace = true
aero-eng.workspace = true
aero-bus.workspace = true
aero-storage.workspace = true
aero-auth.workspace = true
aero-im-core.workspace = true
aero-ai.workspace = true
aero-live-core.workspace = true
aero-live-rtmp.workspace = true
aero-live-srt.workspace = true
aero-live-whip.workspace = true
aero-live-webrtc.workspace = true
aero-im-call.workspace = true
aero-signaling.workspace = true
aero-push.workspace = true

fred.workspace = true

sqlx.workspace = true

tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["rt"] }
futures.workspace = true
async-trait.workspace = true
# Outbound HTTP for the cross-node call-bridge subscribe control call (方向五).
reqwest.workspace = true

axum.workspace = true
# Extra tower/tower-http features for the gateway hardening stack:
#   tower `limit`        → ConcurrencyLimitLayer (global in-flight cap)
#   tower-http `timeout` → TimeoutLayer (per-request wall-clock timeout)
# Request body bounding uses axum's built-in `DefaultBodyLimit` (no extra feature).
tower = { workspace = true, features = ["limit"] }
tower-http = { workspace = true, features = ["timeout", "compression-gzip", "set-header"] }
hyper.workspace = true
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
time.workspace = true
ulid.workspace = true
uuid.workspace = true
bytes.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
# SAML 2.0 SP (HTTP-Redirect binding): the AuthnRequest is DEFLATE-compressed
# (RFC 1951, raw — no zlib/gzip header) then base64+url-encoded. `flate2` is
# already a vetted direct dep in `aero-ai`; `form_urlencoded` ships with the
# `url` crate family already in the workspace lockfile.
flate2 = "1"
form_urlencoded = "1"
async-nats.workspace = true
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Pure-Rust XML-Security suite (XML-DSig verify + exclusive-C14N + XSW guard),
# `#![forbid(unsafe_code)]`, zero system C deps. Used ONLY behind the opt-in
# `AERO_SAML_EXPERIMENTAL_VERIFY` env gate (see `crate::saml`). SECURITY: this is
# a pre-1.0, NOT third-party-audited crate — see the caveat in `saml.rs`.
bergshamra = "0.5.1"

[dev-dependencies]
pretty_assertions.workspace = true
# Adversarial SAML signature tests mint a throwaway RSA keypair + self-signed
# X.509 cert (rcgen, fed an `rsa`-generated key) and sign a SAML Response with
# bergshamra, then assert legitimate/tampered/XSW/wrong-cert/unsigned verdicts.
# All transitively present in the lockfile already; dev-only, never shipped.
rcgen = "0.14"
rsa = "0.9"
rand = "0.8"
