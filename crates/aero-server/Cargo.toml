[package]
name = "aero-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
# The experimental XML-DSig implementation has transitive dependencies whose
# current MSRV exceeds Aero IM's Rust 1.80 baseline. Keep it outside the default
# production/MSRV graph; enabling this feature still requires the explicit
# runtime env gate and remains unsupported for production security.
saml-experimental-bergshamra = ["dep:bergshamra"]

[lints]
workspace = true

[[bin]]
name = "aero-server"
path = "src/bin/main.rs"

[[bin]]
name = "aero-cli"
path = "src/bin/aero-cli.rs"

[dependencies]
aero-common.workspace = true
aero-eng.workspace = true
aero-bus.workspace = true
aero-storage.workspace = true
aero-auth.workspace = true
aero-im-core.workspace = true
aero-ai.workspace = true
aero-live-core.workspace = true
aero-live-rtmp.workspace = true
aero-live-srt.workspace = true
aero-live-whip.workspace = true
aero-live-webrtc.workspace = true
aero-im-call.workspace = true
aero-signaling.workspace = true
aero-push.workspace = true

fred = { workspace = true, features = ["i-scripts"] }

sqlx.workspace = true

tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["rt"] }
futures.workspace = true
async-trait.workspace = true
# Outbound HTTP for the cross-node call-bridge subscribe control call (方向五).
reqwest.workspace = true

axum.workspace = true
# Extra tower/tower-http features for the gateway hardening stack:
#   tower `limit`        → ConcurrencyLimitLayer (global in-flight cap)
#   tower-http `timeout` → TimeoutLayer (per-request wall-clock timeout)
# Request body bounding uses axum's built-in `DefaultBodyLimit` (no extra feature).
tower = { workspace = true, features = ["limit"] }
tower-http = { workspace = true, features = ["timeout", "compression-gzip", "set-header"] }
hyper.workspace = true
lettre = { version = "=0.11.18", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
time.workspace = true
ulid.workspace = true
uuid.workspace = true
bytes.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
rand.workspace = true
hex = "0.4"
# SAML 2.0 SP (HTTP-Redirect binding): the AuthnRequest is DEFLATE-compressed
# (RFC 1951, raw — no zlib/gzip header) then base64+url-encoded. `flate2` is
# already a vetted direct dep in `aero-ai`; `form_urlencoded` ships with the
# `url` crate family already in the workspace lockfile.
flate2 = "1"
form_urlencoded = "1"
url.workspace = true
async-nats.workspace = true
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Namespace-aware bounded XML parsing for the fail-closed SAML shell and
# conditions checks. This is the parser re-exported by bergshamra, depended on
# directly so the Rust 1.80 default graph does not pull its crypto suite.
uppsala = { path = "../../vendor/uppsala-msrv/uppsala", version = "0.4.0" }
# Pure-Rust XML-Security suite (XML-DSig verify + exclusive-C14N + XSW guard),
# `#![forbid(unsafe_code)]`, zero system C deps. Used ONLY when both this Cargo
# feature and `AERO_SAML_EXPERIMENTAL_VERIFY` are enabled. SECURITY: pre-1.0,
# not third-party audited, and outside the workspace MSRV promise.
bergshamra = { version = "0.5.1", optional = true }

[dev-dependencies]
pretty_assertions.workspace = true
# Adversarial SAML signature tests mint a throwaway RSA keypair + self-signed
# X.509 cert (rcgen, fed an `rsa`-generated key) and sign a SAML Response with
# bergshamra, then assert legitimate/tampered/XSW/wrong-cert/unsigned verdicts.
# All transitively present in the lockfile already; dev-only, never shipped.
rcgen = "=0.14.7"
rsa = "0.9"
