[package]
name = "aero-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "aero-server"
path = "src/bin/aero-server.rs"

[[bin]]
name = "aero-cli"
path = "src/bin/aero-cli.rs"

[dependencies]
aero-common.workspace = true
aero-bus.workspace = true
aero-storage.workspace = true
aero-auth.workspace = true
aero-im-core.workspace = true
aero-ai.workspace = true
aero-live-core.workspace = true
aero-live-rtmp.workspace = true
aero-live-whip.workspace = true
aero-signaling.workspace = true
aero-push.workspace = true

sqlx.workspace = true

tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["rt"] }
futures.workspace = true
async-trait.workspace = true

axum.workspace = true
# Extra tower/tower-http features for the gateway hardening stack:
#   tower `limit`        → ConcurrencyLimitLayer (global in-flight cap)
#   tower-http `timeout` → TimeoutLayer (per-request wall-clock timeout)
# Request body bounding uses axum's built-in `DefaultBodyLimit` (no extra feature).
tower = { workspace = true, features = ["limit"] }
tower-http = { workspace = true, features = ["timeout"] }
hyper.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
time.workspace = true
ulid.workspace = true
uuid.workspace = true
bytes.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
async-nats.workspace = true
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
pretty_assertions.workspace = true
