# Webhooks (0013): HMAC-SHA256 signing of outgoing deliveries + SHA-256 hashing
# of incoming tokens; reqwest is the real `WebhookSender`/`ReqwestUnfurler` HTTP
# transport. sha2/hex are shared with SCIM (0015) + invitations (0017) + PAT
# (0019) token hashing + link-unfurl (0024) URL-cache keys.
