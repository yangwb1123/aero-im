[package]
name = "aero-im-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aero-common.workspace = true
aero-storage.workspace = true
aero-bus.workspace = true

tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
# ROADMAP 第三版 方向一: per-subject seq counters for the process-local
# `LocalSeqProvider` (`DashMap<String, AtomicU64>`).
dashmap.workspace = true

serde.workspace = true
serde_json.workspace = true
# Deterministic (v5) `delivery_id` derivation for NotifyBatch idempotency
# (mig 0137): the same message's same notification batch must derive the same
# UUID on redelivery so `insert_many`'s ON CONFLICT can de-duplicate.
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
time.workspace = true
bytes.workspace = true

# Redis (fred) backs the optional cross-node spam-guard aggregation
# (`spam_guard::RedisActivityStore`); the in-process DashMap stays the default.
fred.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "net", "time", "io-util"] }
pretty_assertions.workspace = true
sqlx.workspace = true
# G1 (end-to-end drill suite): the governance drill module runs the REAL
# `AuditRelay`/`PgOutboxRepo`/`StubSink` over write-path rows. No cycle —
# aero-audit-connector depends only on aero-common/aero-auth; reqwest is
# needed for `RelayConfig`'s `reqwest::Url` fields (`StubSink::token_url()`
# returns String). Both are workspace-pinned / lockfile-resident — zero new
# supply-chain entries.
aero-audit-connector.workspace = true
reqwest.workspace = true
