[package]
name = "aero-audit-connector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aero-common.workspace = true
aero-auth.workspace = true
# B5-1 R9 drill leg 2: the `aero-audit-l1-parity-drill` bin drives the REAL
# `MessageRepo::insert_outboxed` send path (S1 seam). Regular dependency, not
# dev: the harness runs the drill via `cargo run --bin`, which excludes
# dev-dependencies (aero-cli precedent: it lives in aero-server, where
# aero-storage is a regular dep). Acyclic — aero-storage depends only on
# aero-common + infra.
aero-storage.workspace = true

jsonwebtoken.workspace = true
# Stub key material lives in the lib API (`SinkBehavior.signing_key`), so rsa
# is a regular dependency (workspace-pinned 0.9, already in the lockfile).
rsa.workspace = true
rand.workspace = true

tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
futures.workspace = true

reqwest.workspace = true
sqlx.workspace = true

serde.workspace = true
serde_json.workspace = true

thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true

time.workspace = true
uuid.workspace = true
# Unverified JWT claim payload decode (base64url). Already pinned at 0.22 by the
# server and aero-live-srt crates — zero new supply-chain entries.
base64 = "0.22"

[dev-dependencies]
ed25519-dalek = "2.1"
sha2 = "0.10"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "sync", "time"] }
