[package]
name = "aero-live-srt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aero-common.workspace = true
aero-live-core.workspace = true
aero-storage.workspace = true

aero-live-hls.workspace = true

tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "macros"] }
async-trait.workspace = true
bytes.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
ulid = { workspace = true, features = ["serde", "uuid"] }

# Time-limited TURN credentials (coturn `use-auth-secret` REST convention):
# password = base64(HMAC_SHA1(shared_secret, username)). RustCrypto stack.
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"

# SRT AES crypto: PBKDF2-HMAC-SHA1 KEK derivation + AES-128 for key-wrap and
# AES-CTR data-plane encryption. All pure-Rust RustCrypto crates, unsafe-free.
pbkdf2 = { version = "0.12", default-features = false }
aes = "0.8"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "fs", "io-util", "sync"] }
tempfile = "3"
