[package]
name = "aero-live-webrtc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aero-common.workspace = true
aero-live-core.workspace = true
aero-signaling.workspace = true

tokio = { workspace = true, features = ["rt", "sync", "macros"] }
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
ulid = { workspace = true, features = ["serde", "uuid"] }
time.workspace = true
parking_lot.workspace = true
# Pure-Rust crypto backend (no system C toolchain / NASM required) so the SFU
# builds reliably everywhere. RTP mode = forward raw RTP without transcoding.
str0m = { version = "0.19.0", default-features = false, features = ["rust-crypto"] }
