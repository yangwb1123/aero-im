[package]
name = "aero-live-webrtc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aero-common.workspace = true
aero-live-core.workspace = true
aero-signaling.workspace = true

tokio = { workspace = true, features = ["rt", "sync", "macros"] }
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
ulid = { workspace = true, features = ["serde", "uuid"] }
uuid.workspace = true
time.workspace = true
parking_lot.workspace = true
# The str0m DTLS/SRTP path uses its pure-Rust `rust-crypto` backend. This does
# not make unrelated workspace TLS dependencies free of native providers.
# RTP mode forwards raw RTP without transcoding.
str0m = { path = "../../vendor/aero-str0m-msrv/str0m", version = "0.19.0", default-features = false, features = ["rust-crypto"] }
