[workspace]
resolver = "2"
members = [
    "crates/aero-common",
    "crates/aero-bus",
    "crates/aero-storage",
    "crates/aero-auth",
    "crates/aero-signaling",
    "crates/aero-im-core",
    "crates/aero-im-call",
    "crates/aero-live-core",
    "crates/aero-live-rtmp",
    "crates/aero-live-hls",
    "crates/aero-live-whip",
    "crates/aero-live-webrtc",
    "crates/aero-live-srt",
    "crates/aero-ai",
    "crates/aero-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aero-im/aero-im"
authors = ["Aero IM Team"]

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unused_async = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
unnecessary_wraps = "allow"

[workspace.dependencies]
# Internal
aero-common     = { path = "crates/aero-common" }
aero-bus        = { path = "crates/aero-bus" }
aero-storage    = { path = "crates/aero-storage" }
aero-auth       = { path = "crates/aero-auth" }
aero-signaling  = { path = "crates/aero-signaling" }
aero-im-core    = { path = "crates/aero-im-core" }
aero-im-call    = { path = "crates/aero-im-call" }
aero-live-core  = { path = "crates/aero-live-core" }
aero-live-rtmp  = { path = "crates/aero-live-rtmp" }
aero-live-hls   = { path = "crates/aero-live-hls" }
aero-live-whip  = { path = "crates/aero-live-whip" }
aero-live-webrtc= { path = "crates/aero-live-webrtc" }
aero-live-srt   = { path = "crates/aero-live-srt" }
aero-ai         = { path = "crates/aero-ai" }

# Runtime
tokio       = { version = "1.40", features = ["full"] }
tokio-util  = { version = "0.7", features = ["full"] }
futures     = "0.3"
async-trait = "0.1"

# HTTP / WS
axum        = { version = "0.7", features = ["ws", "macros", "multipart"] }
tower       = { version = "0.5", features = ["util"] }
tower-http  = { version = "0.6", features = ["trace", "cors", "fs", "compression-gzip"] }
hyper       = { version = "1", features = ["full"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_with  = "3"

# Errors
thiserror   = "1"
anyhow      = "1"

# Logging / observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.27"
opentelemetry      = "0.26"
opentelemetry-otlp = { version = "0.26", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk  = { version = "0.26", features = ["rt-tokio"] }

# Identity / time
ulid        = { version = "1", features = ["serde"] }
uuid        = { version = "1", features = ["v4", "v7", "serde"] }
time        = { version = "0.3", features = ["serde", "macros", "formatting"] }
chrono      = { version = "0.4", features = ["serde"] }

# Persistence
sqlx        = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "time",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
pgvector    = { version = "0.4", features = ["sqlx"] }
fred        = { version = "9", features = ["enable-rustls"] }

# Messaging
async-nats  = "0.36"

# Auth
jsonwebtoken = "9"
argon2       = "0.5"
password-hash = "0.5"
rand         = "0.8"
rsa          = { version = "0.9", features = ["pem"] }

# Config
figment     = { version = "0.10", features = ["toml", "env"] }
dotenvy     = "0.15"

# HTTP client
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Testing
testcontainers = "0.23"
pretty_assertions = "1"

# Misc
bytes       = "1"
url         = { version = "2", features = ["serde"] }
itertools   = "0.13"
parking_lot = "0.12"
dashmap     = "6"

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
