# Aero IM — example configuration.
# Copy to `config.toml` and edit. Every key is overridable via AERO__SECTION__KEY env vars
# (e.g. AERO__SERVER__PORT=8080).

[server]
host = "0.0.0.0"
port = 8080
web_dir = "./web"
# RTMP binds independently from the HTTP gateway. When this host is wildcard,
# stream-create responses advertise AERO_INGEST_HOST or the AERO_PUBLIC_BASE_URL host.
rtmp_listen = "0.0.0.0:1935"
# ---- B5-4 audit-outbox sampler (env-only, not figment) ----
# AERO__SERVER__AUDIT_OUTBOX_FULL_SAMPLE_SECS: Tier-2 full-sample cadence.
#   0 = disabled (one boot info); valid positive = interval; absent = 300;
#   garbage/negative/overflow = fail-closed DISABLED + one boot error (a typo
#   cannot quintuple the most expensive sampler). Tier-1 (30s) is unconditional.
# AERO_METRICS_TOKEN: bearer token for /metrics (default unauthenticated — set
#   one in production).
# AERO_AUDIT_PROVISION_FRESHNESS_SECS: settle-face heartbeat freshness window
#   (default 300, bounds [60, 86400]) — see .env.example audit relay block.

[database]
url = "postgres://aero:aero_dev_pw@localhost:5432/aero"
max_connections = 16
# Optional streaming read replica. Only explicitly eventual, already-authorized
# single-room reads use it; auth/security, cross-room, latest/reconnect and all
# write/read-after-write paths remain on `url`. Omit to route every read to primary.
# replica_url = "postgres://aero:replace-me@replica.internal:5432/aero"

[redis]
url = "redis://localhost:6379"

[nats]
url = "nats://localhost:4222"

[auth]
# Generate with: ./scripts/gen-jwt-keys.sh
# In production, prefer AERO__AUTH__JWT_PRIVATE_KEY_PEM / AERO__AUTH__JWT_PUBLIC_KEY_PEM env vars.
jwt_private_key_pem = """
-----BEGIN PRIVATE KEY-----
REPLACE_WITH_OUTPUT_OF_scripts/gen-jwt-keys.sh
-----END PRIVATE KEY-----
"""
jwt_public_key_pem = """
-----BEGIN PUBLIC KEY-----
REPLACE_WITH_OUTPUT_OF_scripts/gen-jwt-keys.sh
-----END PUBLIC KEY-----
"""
issuer = "aero-im"
access_ttl_secs = 3600           # 1 hour
refresh_ttl_secs = 604800        # 7 days

[telemetry]
otlp_endpoint = "http://localhost:4317"
log_level = "info,aero=debug"

# Account-summary target binding is configured through environment variables,
# not this general config file. When enabled, set
# AERO__ACCOUNT_SOURCE__REGION and the dedicated
# AERO__ACCOUNT_SUMMARY__TARGET_ASSERTION_* values from .env.example. The
# JWKS URI must be an external Aero ID target-assertion JWKS, never Snaplink's.

# Optional S3-compatible residency backends. `default` is reserved for the
# primary AERO_BLOB_BACKEND/LocalFs store and must not be declared here.
# Workspace Owner/Admin can select only these keys (or `default`) for future
# room-scoped uploads. Each blob snapshots its selected key, so changing a
# workspace later never moves or misroutes existing bytes.
# [storage_regions.eu-central-1]
# endpoint = "https://s3.eu-central-1.amazonaws.com"
# bucket = "aero-blobs-eu-central-1"
# region = "eu-central-1"
# access_key = "replace-me"
# secret_key = "replace-me"
# Optional: PUT requests use SSE-KMS; the encryption headers are SigV4-signed.
# Blank, untrimmed, oversized, or header-unsafe values abort startup.
# kms_key_id = "arn:aws:kms:eu-central-1:123456789012:key/replace-me"

# SMTP / transactional email (password reset, workspace invitations).
# When absent, password-reset requests remain enumeration-safe no-ops.
# Configure via `AERO__EMAIL__*` env vars or this section. STARTTLS is required
# by default; `starttls = false` selects implicit TLS (normally port 465).
# [email]
# host = "smtp.example.com"
# port = 587
# username = "avc@example.com"
# password = "smtp-password"
# from = "noreply@example.com"
# starttls = true
# Local capture servers only: forces plaintext and fails closed for non-loopback hosts.
# allow_insecure_localhost = false
