# Aero IM — engineering thresholds and check configuration.
# The native filesize checks read [filesize] from this file. Shell gates keep
# their script-defined defaults; [complexity] and [check] are parsed but do
# not currently change gate behavior.

[filesize]
# Rust source: warn above this line count, hard-fail above hard_limit
rust_warn = 800
rust_hard = 1200
# routes.rs has its own higher exemption
routes_hard = 3000
# JavaScript (web/): matches scripts/file-size-check.sh (WARN >600, HARD >1000)
js_warn = 600
js_hard = 1000

[complexity]
# Currently unused by the gate; it uses the script's fixed >50-line heuristic
# and is warning-only, not cyclomatic complexity.
warn = 12
hard = 20

[check]
# Currently unused; `check` always runs all three cargo commands.
clippy = true
full_test = true
